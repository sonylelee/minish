<!DOCTYPE html>
<meta charset="utf-8">
<title>[실험] 얼굴 변형 미리보기 1단계 — SONEED</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C81D74">
<style>
  :root{ --pink:#C81D74; --line:#e6e6ea; --ink:#1a1a1f; --sub:#71717a; --bg:#fafafa; }
  *{box-sizing:border-box}
  body{margin:0;padding:20px;font:15px/1.6 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;color:var(--ink);background:var(--bg)}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .warn{background:#fff8e6;border-color:#f0d999;font-size:13px}
  .warn b{color:#9a6700}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  label{font-size:13px;color:var(--sub)}
  select,input[type=file]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
  button{font:inherit;font-size:14px;font-weight:600;padding:9px 18px;border:0;border-radius:8px;background:var(--pink);color:#fff;cursor:pointer}
  button:disabled{background:#ccc;cursor:default}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.panes{grid-template-columns:1fr}}
  .pane{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .pane h2{font-size:13px;margin:0;padding:8px 10px;background:#f4f4f6;border-bottom:1px solid var(--line);font-weight:600}
  .pane canvas{display:block;margin:0 auto;max-width:100%;max-height:52vh;width:auto;height:auto;background:#000}
  .axis{display:flex;font-size:11px;color:var(--sub);border-top:1px solid var(--line)}
  .axis div{flex:1;padding:5px 8px;text-align:center}
  .axis div+div{border-left:1px solid var(--line)}
  #log{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--sub);white-space:pre-wrap;margin-top:10px}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#f0f0f3;color:var(--sub);margin-left:6px}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:99px;vertical-align:middle;margin-right:4px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-bottom:10px}
  .note{font-size:12px;color:var(--sub);background:#fff8e6;border:1px solid #f0d999;border-radius:8px;padding:6px 12px;margin-bottom:12px}
  .note summary{cursor:pointer;font-weight:600;color:#9a6700}
  .note[open] summary{margin-bottom:5px}
  .controlbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:14px}
  .slrow{display:flex;align-items:center;gap:12px}
  .slrow+.slrow{margin-top:9px}
  .slrow label{flex:0 0 auto}
  #amp{flex:1;min-width:160px;accent-color:#C81D74}
  #tilt{flex:1;max-width:220px;accent-color:#3b82f6}
  .method{white-space:pre-wrap;font:13px/1.75 -apple-system,'Apple SD Gothic Neo',sans-serif;background:#f6f3ff;border:1px solid #ddd0ff;border-radius:12px;padding:12px 16px;margin-top:12px;color:#4a2f8f}
  .method:empty{display:none}
  #comp{flex:1;max-width:220px;accent-color:#e8830c}
  #draw{flex:1;max-width:220px;accent-color:#12a150}
  #roll{flex:1;max-width:220px;accent-color:#7c3aed}
  #ham{flex:1;max-width:220px;accent-color:#0891b2}
  #nostR{flex:1;max-width:220px;accent-color:#d6336c}
  #nostL{flex:1;max-width:220px;accent-color:#e64980}
  #tm{flex:1;max-width:220px;accent-color:#f59f00}
</style>

<div class="wrap">
  <div class="topbar">
    <div><span style="font-weight:700">얼굴 변형 미리보기</span><span class="tag">실험 · z기반 3D · index.html 미반영</span></div>
    <div class="row" style="gap:8px">
      <input type="file" id="file" accept="image/*">
      <select id="rot" title="본인 기준 판독값">
        <option value="R">판독 R</option>
        <option value="L">판독 L</option>
        <option value="중립">중립</option>
      </select>
      <button id="fit" class="ghost" disabled>🔍 얼굴 확대</button>
      <button id="methodBtn" disabled>🩹 개선법</button>
      <button id="cmpBtn" class="ghost" disabled>👁 전/후 비교</button>
      <button id="go" disabled>판독 방향으로 ▶</button>
      <button id="reset" class="ghost">↺ 원위치</button>
      <button id="dots" class="ghost">랜드마크 켬</button>
    </div>
  </div>

  <details class="note">
    <summary>⚠️ 좌우 기준 (§2) — 화면 왼쪽 = 본인 오른쪽</summary>
    판독값 L/R은 <b>본인 기준</b>, 캔버스는 <b>화면 좌표</b>. 이 변환을 놓치면 미리보기가 통째로 반대로 움직입니다.
    캔버스 아래 축으로 확인하세요. 마주 보고 찍은 사진 기준(셀카/거울모드면 반대).
  </details>

  <div class="panes">
    <div class="pane">
      <h2><span class="swatch" style="background:#3b82f6"></span>원본</h2>
      <canvas id="cvA"></canvas>
      <div class="axis"><div>← 화면왼쪽 = <b>본인 R</b></div><div><b>본인 L</b> = 화면오른쪽 →</div></div>
    </div>
    <div class="pane">
      <h2><span class="swatch" style="background:#C81D74"></span>미리보기</h2>
      <canvas id="cvB"></canvas>
      <div class="axis"><div>← 화면왼쪽 = <b>본인 R</b></div><div><b>본인 L</b> = 화면오른쪽 →</div></div>
    </div>
  </div>

  <div class="controlbar">
    <div class="slrow">
      <label style="min-width:96px">① 원근 기울기 <span style="color:var(--sub);font-weight:400">(카메라 아래)</span></label>
      <input type="range" id="tilt" min="0" max="30" step="1" value="10" disabled>
      <span id="tiltVal" style="font-variant-numeric:tabular-nums;min-width:44px;text-align:right">10°</span>
    </div>
    <div class="slrow">
      <label style="min-width:96px">② 회전 <span style="color:var(--sub);font-weight:400">←화면왼쪽·오른쪽→</span></label>
      <input type="range" id="amp" min="-30" max="30" step="0.5" value="0" disabled>
      <span id="ampVal" style="font-variant-numeric:tabular-nums;min-width:56px;text-align:right;font-weight:700">0.0%</span>
    </div>
    <div class="slrow">
      <label style="min-width:96px">③ 2층 햄버거시프트 <span style="color:var(--sub);font-weight:400">(광대 코쪽+반대 두상 축소)</span></label>
      <input type="range" id="ham" min="-100" max="100" step="5" value="0" disabled>
      <span id="hamVal" style="font-variant-numeric:tabular-nums;min-width:44px;text-align:right">0%</span>
    </div>
    <div class="slrow">
      <label style="min-width:96px">④ 턱&마루 시프트 <span style="color:var(--sub);font-weight:400">(대각: 한쪽턱+반대 두상)</span></label>
      <input type="range" id="tm" min="-100" max="100" step="5" value="0" disabled>
      <span id="tmVal" style="font-variant-numeric:tabular-nums;min-width:44px;text-align:right">0%</span>
    </div>
    <div class="slrow">
      <label style="min-width:96px">⑤ 드로잉 <span style="color:var(--sub);font-weight:400">(1·2층 당김)</span></label>
      <input type="range" id="draw" min="-100" max="100" step="5" value="0" disabled>
      <span id="drawVal" style="font-variant-numeric:tabular-nums;min-width:44px;text-align:right">0%</span>
    </div>
    <div class="slrow">
      <label style="min-width:96px">⑥ 문어 압축 <span style="color:var(--sub);font-weight:400">(본인 ←왼·오른→)</span></label>
      <input type="range" id="comp" min="-100" max="100" step="5" value="0" disabled>
      <span id="compVal" style="font-variant-numeric:tabular-nums;min-width:44px;text-align:right">0%</span>
    </div>
    <div class="slrow">
      <label style="min-width:96px">⑦ 콧볼 오른쪽 <span style="color:var(--sub);font-weight:400">(본인 · +위/−아래)</span></label>
      <input type="range" id="nostR" min="-100" max="100" step="5" value="0" disabled>
      <span id="nostRVal" style="font-variant-numeric:tabular-nums;min-width:44px;text-align:right">0%</span>
    </div>
    <div class="slrow">
      <label style="min-width:96px">⑧ 콧볼 왼쪽 <span style="color:var(--sub);font-weight:400">(본인 · +위/−아래)</span></label>
      <input type="range" id="nostL" min="-100" max="100" step="5" value="0" disabled>
      <span id="nostLVal" style="font-variant-numeric:tabular-nums;min-width:44px;text-align:right">0%</span>
    </div>
    <div class="slrow">
      <label style="min-width:96px">⑨ 전체 기울이기 <span style="color:var(--sub);font-weight:400">(수평 보정)</span></label>
      <input type="range" id="roll" min="-12" max="12" step="0.5" value="0" disabled>
      <span id="rollVal" style="font-variant-numeric:tabular-nums;min-width:44px;text-align:right">0.0°</span>
    </div>
    <div id="log">사진을 올리면 랜드마크를 잡습니다.</div>
  </div>
  <div id="method" class="method"></div>
</div>

<script type="module">
/* ===== [실험] 얼굴 변형 미리보기 1단계 =====
   CLAUDE.md §14-1. index.html과 분리된 실험 파일.
   MediaPipe 로드 방식·모델은 index.html getLandmarker()와 동일하게 맞춤. */

const $=id=>document.getElementById(id);
const log=m=>{$('log').textContent=m};

/* ---- MediaPipe (index.html:617-630과 동일 버전/모델) ---- */
let _fl=null,_flLoading=null;
async function getLandmarker(){
  if(_fl)return _fl;
  if(_flLoading)return _flLoading;
  _flLoading=(async()=>{
    const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const fs=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    _fl=await vision.FaceLandmarker.createFromOptions(fs,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'},
      runningMode:'IMAGE',numFaces:1,minFaceDetectionConfidence:0.25,minFacePresenceConfidence:0.25,minTrackingConfidence:0.25
    });
    return _fl;
  })();
  return _flLoading;
}

/* ---- 랜드마크 인덱스 (§12) ---- */
const IDX_FOREHEAD=10, IDX_CHIN=152;          // faceH 정규화 기준
const IDX_OUT_A=234, IDX_OUT_B=454;           // 얼굴 외곽 (좌/우는 x로 판별)

/* 광대(2층) 밴드. 두 덩어리로 나눠두고, 어느 쪽이 화면 왼쪽인지는
   인덱스로 가정하지 않고 실제 x좌표 평균으로 판별한다(§12 pick 방식). */
const CHEEK_A=[234,227,116,117,118,119,100,142,205,36,203,206,207,187,123,50];
const CHEEK_B=[454,447,345,346,347,348,329,371,425,266,423,426,427,411,352,280];

/* ---- ★ 좌우 변환 (§2 · §14-1) — 이 파일에서 가장 중요한 함수 ----
   본인 기준 방향 → 화면 x축 부호.
   화면 왼쪽 = 본인 오른쪽 이므로:  본인 R → 화면 -x,  본인 L → 화면 +x. */
function ownSideToScreenDx(ownSide){
  if(ownSide==='R') return -1;   // 본인 오른쪽 = 화면 왼쪽
  if(ownSide==='L') return +1;   // 본인 왼쪽  = 화면 오른쪽
  return 0;
}
/* ★ 개선 방향 (§14-1, 2026-07-18 대표 확정): 미리보기에서 광대가 이동하는 '본인 기준' 방향.
   확정 규칙 = 회전 라벨과 '같은' 본인 쪽. (L 회전→본인 왼쪽, R 회전→본인 오른쪽, 중립→이동 없음)
   ※ 초기엔 '회전의 반대'로 구현했으나 방향이 뒤집혀 대표 확인 후 '같은 쪽'으로 수정. */
function moveOwnSide(rotOwn){
  if(rotOwn==='R') return 'R';
  if(rotOwn==='L') return 'L';
  return null;                   // 중립 → 변형 없음
}

/* ---- 상태 ---- */
let P=null, srcCanvas=null, showDots=true, origImg=null, curRegion=null, isFit=false;

function loadImage(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});}

/* ---- 사진 로드 → 전체 사진으로 시작 ---- */
$('file').onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  log('사진 읽는 중…');
  const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
  origImg=await loadImage(url);
  isFit=false; $('fit').textContent='🔍 얼굴 확대';
  await setSource(0,0,origImg.width,origImg.height);
};

/* 원본의 (rx,ry,rw,rh) 영역을 크롭해 srcCanvas로(최대 680px, 최대 3배 확대) → 재인식 */
async function setSource(rx,ry,rw,rh){
  curRegion={x:rx,y:ry,w:rw,h:rh};
  let scale=680/Math.max(rw,rh); if(scale>3)scale=3;
  srcCanvas=document.createElement('canvas');
  srcCanvas.width=Math.max(2,Math.round(rw*scale)); srcCanvas.height=Math.max(2,Math.round(rh*scale));
  srcCanvas.getContext('2d').drawImage(origImg, rx,ry,rw,rh, 0,0, srcCanvas.width, srcCanvas.height);
  await detectAndRender();
}

async function detectAndRender(){
  log('얼굴 인식 중… (첫 실행은 모델 내려받느라 몇 초 걸립니다)');
  try{
    const lm=await getLandmarker();
    const out=lm.detect(srcCanvas);
    if(!out.faceLandmarks||!out.faceLandmarks.length){
      P=null; for(const id of ['go','amp','tilt','comp','draw','roll','ham','nostR','nostL','tm','methodBtn','cmpBtn']) $(id).disabled=true; $('fit').disabled=!origImg;
      log('❌ 얼굴을 못 찾았습니다.'+(isFit?' [🔍] 버튼을 다시 눌러 전체 사진으로 돌아가 보세요.':' (§2 fallback)'));
      draw($('cvA'),srcCanvas,null); draw($('cvB'),srcCanvas,null); return;
    }
    P=out.faceLandmarks[0].map(p=>({x:p.x*srcCanvas.width,y:p.y*srcCanvas.height,z:p.z*srcCanvas.width})); // z=깊이(§14-1 B)
    for(const id of ['go','amp','tilt','comp','draw','roll','ham','nostR','nostL','tm','fit','methodBtn','cmpBtn']) $(id).disabled=false;
    $('amp').value=0; $('ampVal').textContent='0.0%';
    draw($('cvA'),srcCanvas,P);
    render(0);
    log(`✅ 랜드마크 ${P.length}개 인식 · ${isFit?'얼굴 확대':'전체 사진'} · ${srcCanvas.width}×${srcCanvas.height}px\n슬라이더를 좌우로 드래그하면 회전합니다.`);
  }catch(err){ log('❌ 오류: '+err.message); }
}

/* 🔍 얼굴 확대 ↔ 전체 사진 토글: 랜드마크 bbox를 원본 좌표로 되돌려 크롭 */
async function fitIn(){
  if(!origImg||!P||!curRegion) return;
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const p of P){ if(p.x<minx)minx=p.x; if(p.x>maxx)maxx=p.x; if(p.y<miny)miny=p.y; if(p.y>maxy)maxy=p.y; }
  const sx=curRegion.w/srcCanvas.width, sy=curRegion.h/srcCanvas.height;   // srcCanvas → 원본 좌표
  let ox=curRegion.x+minx*sx, oy=curRegion.y+miny*sy, ow=(maxx-minx)*sx, oh=(maxy-miny)*sy;
  const mx=ow*0.35, mTop=oh*0.55, mBot=oh*0.30;                            // 여백(위=이마·머리 더)
  ox-=mx; oy-=mTop; ow+=2*mx; oh+=mTop+mBot;
  if(ox<0){ow+=ox;ox=0;} if(oy<0){oh+=oy;oy=0;}
  if(ox+ow>origImg.width) ow=origImg.width-ox;
  if(oy+oh>origImg.height) oh=origImg.height-oy;
  isFit=true; $('fit').textContent='🖼 전체 사진';
  await setSource(ox,oy,ow,oh);
}
$('fit').onclick=async ()=>{
  if(!origImg) return;
  if(isFit){ isFit=false; $('fit').textContent='🔍 얼굴 확대'; await setSource(0,0,origImg.width,origImg.height); return; }
  await fitIn();
};

/* ---- 광대 밴드를 '본인 기준' 두 그룹으로 정리 ----
   인덱스가 어느 쪽인지 가정하지 않는다. x평균이 작은 쪽이 화면 왼쪽 = 본인 오른쪽. */
function cheekGroups(){
  const mk=idx=>{
    const pts=idx.map(i=>P[i]).filter(Boolean);
    const cx=pts.reduce((s,p)=>s+p.x,0)/pts.length;
    const cy=pts.reduce((s,p)=>s+p.y,0)/pts.length;
    return {idx,pts,cx,cy};
  };
  const a=mk(CHEEK_A), b=mk(CHEEK_B);
  const screenLeft = a.cx<b.cx ? a : b;      // 화면 왼쪽
  const screenRight= a.cx<b.cx ? b : a;      // 화면 오른쪽
  return { ownR:screenLeft, ownL:screenRight };   // ★ 화면왼쪽 = 본인오른쪽
}

/* ---- 실제 깊이(z) 기반 3D 회전 변위장 (§14-1 B, 2026-07-18) ----
   MediaPipe 468 랜드마크의 (x,y,z)를 세로축 yaw 회전. 각 랜드마크의 화면 변위를 구해 IDW 보간.
   - 가로: 실제 z로 깊이 시차(튀어나온 코가 광대와 다르게 움직임). ← B의 핵심
   - 세로: 순수 원근투영의 회전유발분은 2차항이라 사실상 0이라(정지분은 원본에 이미 있어 뺌),
     대표 관찰(카메라 아래 + 회전)을 명시적 항으로 재현:
       ① 좌우 비대칭 상승: 회전 방향 쪽 라인이 올라감(SRISE).
       ② 세로 벌어짐: 중심 위(눈·이마)↑ / 아래(입·턱)↓ (SFAN). ← "입술은 내려간다"
   변위는 yaw=0에서 정확히 0 → 0%는 원본 그대로. YAWS: pct>0→화면 오른쪽 회전(테스트로 확정).
   두 세로 항은 원근 슬라이더(sp)로 함께 조절. 한계: 가림(occlusion) 없음 → 크게 돌리면 실루엣 뭉갬. */
const YAWS=-1;
function faceCentroid(){
  let sx=0,sy=0,sz=0; for(const p of P){sx+=p.x;sy+=p.y;sz+=p.z;}
  const n=P.length; return {cx:sx/n, cy:sy/n, cz:sz/n};
}
/* 변위 그리드 스무딩: [1 2 1]/4 분리형 블러 iter회 (IDW 특유의 울렁임 제거 → 피부 안 움) */
function smoothGrid(g,w,h,iter){
  const tmp=new Float32Array(w*h);
  for(let it=0;it<iter;it++){
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const b=g[y*w+x];
      tmp[y*w+x]=(g[y*w+(x>0?x-1:x)]+2*b+g[y*w+(x<w-1?x+1:x)])*0.25;
    }
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const b=tmp[y*w+x];
      g[y*w+x]=(tmp[(y>0?y-1:y)*w+x]+2*b+tmp[(y<h-1?y+1:y)*w+x])*0.25;
    }
  }
}

/* o={yawRad,pitchRad,comp,draw,roll}. 여러 변형을 랜드마크 변위로 합산해 IDW, roll은 field에서 해석적으로.
   부호는 모두 본인 기준→§2(화면왼쪽=본인오른쪽)로 변환. 수치 테스트로 방향 확정. */
function makeField(o){
  const {cx,cy,cz}=faceCentroid();
  const yawRad=o.yawRad||0, pitchRad=o.pitchRad||0, comp=o.comp||0, drawv=o.draw||0, roll=o.roll||0, ham=o.ham||0, nR=o.nostrilR||0, nL=o.nostrilL||0, tm=o.tmComp||0;
  const st=Math.sin(YAWS*yawRad), ct=Math.cos(yawRad), sp=Math.sin(pitchRad);
  const fW=Math.hypot(P[IDX_OUT_A].x-P[IDX_OUT_B].x,P[IDX_OUT_A].y-P[IDX_OUT_B].y);
  const fH=Math.abs(P[IDX_CHIN].y-P[IDX_FOREHEAD].y), halfW=fW/2, chinY=P[IDX_CHIN].y, foreY=P[IDX_FOREHEAD].y;
  const SRISE=2.8, SFAN=4.0;                       // 세로 항 세기(원근 슬라이더 sp로 함께 조절)
  const kc=(Math.abs(comp)/100)*0.45, compSide=comp>0?-1:1;   // ① comp>0=본인오른쪽(화면왼쪽 Xc<0) 압축
  const dN=-drawv/100, PULL=fW*0.14, LIFT=fH*0.13;           // ② 드로잉 세기(슬라이더 방향 반전: 대표 요청)
  const N=P.length;
  const dispX=new Float64Array(N), dispY=new Float64Array(N);
  for(let i=0;i<N;i++){                            // 랜드마크별 화면 변위(모든 슬라이더 0에서 정확히 0)
    const Xc=P[i].x-cx, Yc=P[i].y-cy, Zc=P[i].z-cz;
    let dX=Xc*(ct-1) + Zc*st;                       // (A) yaw + 실제 깊이 시차
    let dY=SRISE*Xc*st*sp + SFAN*Yc*(1-ct)*sp;      //     세로①상승 + 세로②눈↑입↓
    if(kc>0){                                       // (B) 문어(리프팅): 턱을 귀 쪽으로 올리고 눈은 내림
      const ramp=(Math.sign(Xc)===compSide)?Math.min(1,Math.abs(Xc)/halfW):0;
      if(ramp>0){
        dY+=-kc*(Yc+0.05*fH)*ramp;                  // 피벗(눈아래) 기준: 눈(위)↓ / 콧볼·입·턱(아래)↑
        const lowerW=Math.max(0,Math.min(1,Yc/(0.35*fH)));
        dX+=kc*0.8*compSide*ramp*lowerW;            // 턱을 귀 쪽(바깥)으로 당김
      }
    }
    if(dN!==0){                                     // (C) 드로잉: 3층(이마) 고정, 1·2층만 당김+한쪽 올림
      const _u=Math.max(0,Math.min(1,(Yc/fH+0.13)/0.14)),_d=Math.max(0.45,Math.min(1,1-(Yc/fH-0.15)/0.30)),vw=_u*_d;  // 이마(3층)만 고정, 광대(2층)~턱(1층) 함께
      dX+=-dN*PULL*vw;
      dY+=-dN*LIFT*vw*(Xc/halfW);
    }
    dispX[i]=dX; dispY[i]=dY;
  }
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;       // 얼굴 bbox + 여유
  for(const p of P){ if(p.x<minx)minx=p.x; if(p.x>maxx)maxx=p.x; if(p.y<miny)miny=p.y; if(p.y>maxy)maxy=p.y; }
  const bw=maxx-minx, bh=maxy-miny; minx-=bw*0.28; maxx+=bw*0.28; miny-=bh*0.28; maxy+=bh*0.28;
  const cell=Math.max(6, fW/28);
  const eps=cell*cell*0.25;                         // IDW 완충값(클수록 부드러움, 클러스터 첨점 완화)
  const gW=Math.max(2,Math.ceil((maxx-minx)/cell)+1), gH=Math.max(2,Math.ceil((maxy-miny)/cell)+1);
  const gx=new Float32Array(gW*gH), gy=new Float32Array(gW*gH);
  const ax=(maxx-minx)/2, ay=(maxy-miny)/2, mcx=(minx+maxx)/2, mcy=(miny+maxy)/2;
  for(let j=0;j<gH;j++){
    const wy=miny+j*cell;
    for(let i2=0;i2<gW;i2++){
      const wx=minx+i2*cell;
      let swx=0,swy=0,sw=0;
      for(let k=0;k<N;k++){                         // IDW (Shepard)
        const ex=wx-P[k].x, ey=wy-P[k].y, w=1/(ex*ex+ey*ey+eps);
        sw+=w; swx+=w*dispX[k]; swy+=w*dispY[k];
      }
      const nx=(wx-mcx)/ax, ny=(wy-mcy)/ay;         // 타원 페이드(배경 보호)
      let m=1.25*(1-(nx*nx+ny*ny)); m=m<0?0:(m>1?1:m);
      const idx=j*gW+i2; gx[idx]=(swx/sw)*m; gy[idx]=(swy/sw)*m;
    }
  }
  smoothGrid(gx,gW,gH,2); smoothGrid(gy,gW,gH,2);   // 변위장 부드럽게(피부 울렁임 제거)
  const crr=Math.cos(roll), srr=Math.sin(roll);     // ③ 전체 기울이기(roll) — 얼굴 중심 기준 회전
  // ④ 햄버거 시프트: 한쪽 광대를 코쪽으로 + 반대쪽 귀뒤 두상면(머리카락)을 줄임 (해석적, 랜드마크 밖 포함)
  const hamSA=ham>0?-1:1;                            // side A(광대 이동): ham>0 → 본인오른쪽=화면왼쪽(-1)
  const hamMag=(Math.abs(ham)/100)*fW*0.08;          // 이동량(과하지 않게 축소)
  const _oa=P[IDX_OUT_A], _ob=P[IDX_OUT_B];          // 외곽점(어느 쪽인지 x로 판별, §12)
  const zygA = hamSA<0 ? (_oa.x<_ob.x?_oa:_ob) : (_oa.x<_ob.x?_ob:_oa);  // side A 광대뼈 최외측(측면 최돌출점)
  const zygB = hamSA<0 ? (_oa.x<_ob.x?_ob:_oa) : (_oa.x<_ob.x?_oa:_ob);  // side B(반대쪽) 광대뼈
  const caX=zygA.x, caY=zygA.y;
  const exK=(Math.abs(ham)/100)*0.22;                // 반대쪽 볼 확장 세기
  const field=(x,y,out)=>{
    const rx=x-cx, ry=y-cy;
    let ddx=rx*(crr-1) - ry*srr;                     // roll은 이미지 전체에 적용(귀·머리 포함)
    let ddy=rx*srr + ry*(crr-1);
    if(hamMag>0){                                     // ④ 햄버거(전체 이미지)
      const ax=(x-caX)/(fW*0.16), ay=(y-caY)/(fH*0.22), wA=Math.exp(-0.5*(ax*ax+ay*ay));
      ddx+=-hamSA*hamMag*wA; {const nbx=(x-cx)/(fW*0.13),nby=(y-(cy-fH*0.04))/(fH*0.20),wN=Math.exp(-0.5*(nbx*nbx+nby*nby)); ddx+=-hamSA*hamMag*0.7*wN;} {const jbx=(x-cx)/(fW*0.20),jby=(y-(cy+fH*0.30))/(fH*0.24),wJ=Math.exp(-0.5*(jbx*jbx+jby*jby)); ddx+=-hamSA*hamMag*0.95*wJ;}                          // 광대 최외측(측면 최돌출) → 코쪽(중심)으로
      const sBpos=-hamSA*(x-cx);                      // 반대쪽(side B) 바깥 방향 거리
      let og=(sBpos-fW*0.50)/(fW*0.14); og=og<0?0:(og>1?1:og);  // 얼굴 바깥에서만(볼 안 건드림)
      const vy=(y-(cy-fH*0.05))/(fH*0.42), vmB=Math.exp(-0.5*vy*vy);  // 귀 높이 근처만
      ddx+= hamSA*hamMag*og*vmB;                      // 반대쪽 귀뒤 두상면만 → 중심으로(줄이기)
      const rbx=x-zygB.x, rby=y-zygB.y;               // 반대쪽 볼: 광대뼈 기준 방사 확장(늘어남)
      const wCB=Math.exp(-0.5*((rbx/(fW*0.20))**2+(rby/(fH*0.26))**2));
      ddx+=rbx*exK*wCB; ddy+=rby*exK*wCB;
    }
    if(nR!==0||nL!==0){                               // ⑤⑥ 콧볼 높낮이(본인 오른쪽/왼쪽 따로, +위/−아래)
      const ny=(y-(cy+fH*0.10))/(fH*0.11);
      if(nR!==0){ const gx2=(x-(cx-fW*0.085))/(fW*0.10); ddy+=-(nR/100)*fH*0.06*Math.exp(-0.5*(gx2*gx2+ny*ny)); } // 본인오른쪽=화면왼쪽
      if(nL!==0){ const gx3=(x-(cx+fW*0.085))/(fW*0.10); ddy+=-(nL/100)*fH*0.06*Math.exp(-0.5*(gx3*gx3+ny*ny)); } // 본인왼쪽=화면오른쪽
    }
    if(tm!==0){                                      // ④ 턱&마루 시프트: 대각 짜부 — 한쪽 턱 + 반대쪽 귀 위 두상(햄버거식). tm>0=본인왼쪽턱+본인오른쪽두상 / tm<0=반대 대각. (목은 안 건드림)
      const kk=(Math.abs(tm)/100)*0.45;
      const tmJaw=tm>0?1:-1, tmHead=-tmJaw;           // 화면부호: +1=화면오른쪽(본인왼쪽). 턱과 두상은 대각(반대쪽)
      const earY=(P[IDX_OUT_A].y+P[IDX_OUT_B].y)/2;   // 귀·광대 높이 기준
      let jw2=Math.exp(-0.5*Math.pow((y-(chinY-fH*0.06))/(fH*0.11),2));   // 턱 측면(턱선): chin 살짝 위
      if(y>chinY) jw2*=Math.exp(-0.5*Math.pow((y-chinY)/(fH*0.05),2));    // 턱 아래(목)로는 빠르게 사라짐
      const cw2=Math.exp(-0.5*Math.pow((y-(earY-fH*0.14))/(fH*0.18),2));  // 귀 위쪽 두상(측두부)
      const jawOn=Math.sign(x-cx)===tmJaw?1:0, headOn=Math.sign(x-cx)===tmHead?1:0;  // 대각: 각 밴드는 지정된 한쪽만
      ddx += -kk*(x-cx)*Math.max(jw2*jawOn, cw2*headOn);
    }
    const fx=(x-minx)/cell, fy=(y-miny)/cell;         // 얼굴 영역은 IDW 변위 합산
    if(!(fx<0||fy<0||fx>=gW-1||fy>=gH-1)){
      const x0=fx|0, y0=fy|0, tx=fx-x0, ty=fy-y0;
      const i00=y0*gW+x0, i10=i00+1, i01=i00+gW, i11=i01+1;
      ddx+=(gx[i00]*(1-tx)+gx[i10]*tx)*(1-ty)+(gx[i01]*(1-tx)+gx[i11]*tx)*ty;
      ddy+=(gy[i00]*(1-tx)+gy[i10]*tx)*(1-ty)+(gy[i01]*(1-tx)+gy[i11]*tx)*ty;
    }
    out.dx=ddx; out.dy=ddy;
  };
  field.cx=cx; field.yc=cy;
  return field;
}

/* ---- 워프 (역매핑 + 2D 이중선형보간: 가로·세로 모두) ---- */
function warp(src,field){
  const w=src.width,h=src.height;
  const S=src.getContext('2d').getImageData(0,0,w,h);
  const out=document.createElement('canvas'); out.width=w; out.height=h;
  const ctx=out.getContext('2d'); const D=ctx.createImageData(w,h);
  const sd=S.data, dd=D.data; const d={dx:0,dy:0};
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      field(x,y,d);
      let sx=x-d.dx, sy=y-d.dy;
      if(sx<0)sx=0; else if(sx>w-1)sx=w-1;
      if(sy<0)sy=0; else if(sy>h-1)sy=h-1;
      const x0=sx|0, y0=sy|0, x1=x0+1<w?x0+1:x0, y1=y0+1<h?y0+1:y0;
      const fx=sx-x0, fy=sy-y0;
      const p00=(y0*w+x0)*4, p10=(y0*w+x1)*4, p01=(y1*w+x0)*4, p11=(y1*w+x1)*4;
      const o=(y*w+x)*4;
      for(let k=0;k<3;k++){
        const top=sd[p00+k]*(1-fx)+sd[p10+k]*fx;
        const bot=sd[p01+k]*(1-fx)+sd[p11+k]*fx;
        dd[o+k]=top*(1-fy)+bot*fy;
      }
      dd[o+3]=255;
    }
  }
  ctx.putImageData(D,0,0);
  return out;
}

/* ---- 그리기 ---- */
function draw(cv,base,pts,moved,arrows){
  cv.width=base.width; cv.height=base.height;
  const c=cv.getContext('2d');
  c.drawImage(base,0,0);
  if(pts&&showDots){
    const cheek=new Set([...CHEEK_A,...CHEEK_B]);
    pts.forEach((p,i)=>{
      const isCheek=cheek.has(i);
      c.fillStyle = isCheek ? '#C81D74' : 'rgba(59,130,246,.75)';
      c.beginPath(); c.arc(p.x,p.y,isCheek?1.9:1.0,0,7); c.fill();
    });
  }
  if(arrows){
    for(const a of arrows){
      const col=a.color||'#C81D74';               // 확장=분홍, 축소=파랑
      c.strokeStyle=col; c.fillStyle=col; c.lineWidth=2.5;
      c.beginPath(); c.moveTo(a.x0,a.y0); c.lineTo(a.x1,a.y1); c.stroke();
      const ang=Math.atan2(a.y1-a.y0,a.x1-a.x0);
      c.beginPath();
      c.moveTo(a.x1,a.y1);
      c.lineTo(a.x1-9*Math.cos(ang-0.4), a.y1-9*Math.sin(ang-0.4));
      c.lineTo(a.x1-9*Math.cos(ang+0.4), a.y1-9*Math.sin(ang+0.4));
      c.closePath(); c.fill();
    }
  }
}

/* ---- 실시간 렌더: 슬라이더 값(pct, 부호 있음)으로 회전 미리보기 ----
   pct>0 화면 오른쪽 회전 / pct<0 화면 왼쪽 / 0 원본. 드래그하면 실시간으로 돈다. */
function render(pct){
  if(!P||!srcCanvas) return;
  $('amp').value=pct;
  $('ampVal').textContent=(pct>0?'+':'')+pct.toFixed(1)+'%';
  const tiltVal=parseFloat($('tilt').value);
  const compVal=parseFloat($('comp').value);
  const drawVal=parseFloat($('draw').value);
  const rollVal=parseFloat($('roll').value);
  const hamVal=parseFloat($('ham').value);
  const nostRVal=parseFloat($('nostR').value);
  const nostLVal=parseFloat($('nostL').value);
  const tmVal=parseFloat($('tm').value);
  $('compVal').textContent=(compVal>0?'+':'')+compVal+'%';
  $('drawVal').textContent=(drawVal>0?'+':'')+drawVal+'%';
  $('rollVal').textContent=(rollVal>0?'+':'')+rollVal.toFixed(1)+'°';
  $('hamVal').textContent=(hamVal>0?'+':'')+hamVal+'%';
  $('nostRVal').textContent=(nostRVal>0?'+':'')+nostRVal+'%';
  $('nostLVal').textContent=(nostLVal>0?'+':'')+nostLVal+'%';
  $('tmVal').textContent=(tmVal>0?'+':'')+tmVal+'%';
  if(pct===0 && compVal===0 && drawVal===0 && rollVal===0 && hamVal===0 && nostRVal===0 && nostLVal===0 && tmVal===0){
    draw($('cvB'),srcCanvas, showDots?P:null);
    log('원본(모든 슬라이더 0). 슬라이더를 드래그하세요.');
    return;
  }
  const o={
    yawRad:(pct/100)*30*Math.PI/180,               // ±30% → ±30° yaw
    pitchRad:tiltVal*Math.PI/180,                   // 카메라 피치(도)
    comp:compVal, draw:drawVal,
    roll:rollVal*Math.PI/180,                       // ±12°
    ham:hamVal,                                     // ④ 햄버거 시프트
    nostrilR:nostRVal, nostrilL:nostLVal, tmComp:tmVal,           // ⑤⑥ 콧볼 높낮이
  };
  const field=makeField(o);
  const warped=warp(srcCanvas,field);
  const sc={dx:0,dy:0};
  const movedPts=P.map(p=>{ field(p.x,p.y,sc); return {x:p.x+sc.dx, y:p.y+sc.dy}; });
  const turn=Math.sign(pct);
  const arrows = pct!==0 ? [{ x0:field.cx, y0:field.yc, x1:field.cx+turn*36, y1:field.yc, color:'#C81D74' }] : null;
  draw($('cvB'),warped, showDots?movedPts:null, null, arrows);

  const L=[];
  if(pct!==0)      L.push(`회전 ${(pct>0?'+':'')+pct.toFixed(1)}% → 두개골 ${turn>0?'화면 오른쪽':'화면 왼쪽'} (원근 ${tiltVal}°: 눈↑/입↓)`);
  if(compVal!==0)  L.push(`① 문어 리프팅: 본인 ${compVal>0?'오른쪽':'왼쪽'} 턱을 귀쪽으로 올림 + 눈 내림`);
  if(drawVal!==0)  L.push(`② 드로잉: ${drawVal<0?'본인 왼쪽 턱↑ + 우측으로 당김':'본인 오른쪽 턱↑ + 좌측으로 당김'} (3층 이마 고정)`);
  if(rollVal!==0)  L.push(`③ 전체 기울이기 ${rollVal>0?'+':''}${rollVal.toFixed(1)}° (수평 보정)`);
  if(hamVal!==0)   L.push(`④ 햄버거: 본인 ${hamVal>0?'오른쪽':'왼쪽'} 광대 코쪽으로 + 반대쪽 귀뒤 두상 축소`);
  if(nostRVal!==0) L.push(`⑤ 콧볼 오른쪽 ${nostRVal>0?'올림':'내림'}`);
  if(nostLVal!==0) L.push(`⑥ 콧볼 왼쪽 ${nostLVal>0?'올림':'내림'}`);
  log(L.join('\n'));
}

/* rAF 스로틀: 드래그 중 매 프레임 한 번만 워프(부드럽게) */
let _pend=null,_raf=0;
function queueRender(pct){
  _pend=pct;
  if(!_raf) _raf=requestAnimationFrame(()=>{ _raf=0; if(_pend!=null){ render(_pend); _pend=null; } });
}
$('amp').oninput=()=> queueRender(parseFloat($('amp').value));
$('tilt').oninput=()=>{ $('tiltVal').textContent=$('tilt').value+'°'; queueRender(parseFloat($('amp').value)); };
$('comp').oninput=()=> queueRender(parseFloat($('amp').value));
$('draw').oninput=()=> queueRender(parseFloat($('amp').value));
$('roll').oninput=()=> queueRender(parseFloat($('amp').value));
$('ham').oninput=()=> queueRender(parseFloat($('amp').value));
$('nostR').oninput=()=> queueRender(parseFloat($('amp').value));
$('nostL').oninput=()=> queueRender(parseFloat($('amp').value));
$('tm').oninput=()=> queueRender(parseFloat($('amp').value));

/* '판독 방향으로' — 판독값(L/R/중립)에 맞는 방향으로 슬라이더를 세팅해 시작점 제시.
   이후엔 자유롭게 드래그. (L→화면 오른쪽 +, R→화면 왼쪽 −, 대표 확정 규칙) */
$('go').onclick=()=>{
  if(!P||!srcCanvas)return;
  const rotOwn=$('rot').value;
  if(rotOwn==='중립'){ render(0); return; }
  const turn=ownSideToScreenDx(moveOwnSide(rotOwn));  // +1/−1
  render(turn*6);                                     // 시작 강도 6%
};

/* 👁 전/후 비교: 같은 미리보기 창에서 원본(전) ↔ 변형(후) 토글 */
let _cmpBefore=false;
$('cmpBtn').onclick=()=>{
  if(!P||!srcCanvas)return;
  _cmpBefore=!_cmpBefore;
  $('cmpBtn').textContent=_cmpBefore?'👁 후(변형) 보기':'👁 전/후 비교';
  if(_cmpBefore){ draw($('cvB'),srcCanvas,showDots?P:null); log('전(원본) 표시 중 — 버튼 다시 눌러 후(변형)로'); }
  else render(parseFloat($('amp').value)||0);
};

$('reset').onclick=()=>{
  _cmpBefore=false; $('cmpBtn').textContent='👁 전/후 비교';
  for(const id of ['amp','comp','draw','roll','ham','nostR','nostL','tm']) $(id).value=0;
  $('tilt').value=10; $('tiltVal').textContent='10°';
  $('method').textContent='';
  render(0);
};

/* 🩹 개선법 — 중립으로 맞춘 슬라이더 상태를 읽어 시술 코멘트 생성 (모두 본인 기준) */
$('methodBtn').onclick=()=>{
  if(!P) return;
  const amp=parseFloat($('amp').value), comp=parseFloat($('comp').value),
        draw=parseFloat($('draw').value), roll=parseFloat($('roll').value), ham=parseFloat($('ham').value),
        nostR=parseFloat($('nostR').value), nostL=parseFloat($('nostL').value);
  const out=[];
  if(amp>0) out.push('【2층회전 우측】',
    '· 우측으로 머리 돌린 후 오른광대와 후두면 압박',
    '· 2층 or 3층 왼쪽 귀 뒤에서 우측으로 필러링',
    '· 오른쪽 귀 풀링',
    '· 이마 짚고 광대 왼쪽으로 평행이동');
  else if(amp<0) out.push('【2층회전 좌측】',
    '· 좌측으로 머리 돌린 후 왼광대와 후두면 압박',
    '· 2층 or 3층 오른쪽 귀 뒤에서 좌측으로 필러링',
    '· 왼쪽 귀 풀링',
    '· 이마 짚고 광대 오른쪽으로 평행이동');
  if(comp<0) out.push('【문어 왼쪽】',
    '· 왼쪽얼굴 문어 (턱 왼쪽으로 당기기)',
    '· 오른쪽 얼굴 늘리기 (이마리프팅&사선내리기)');
  else if(comp>0) out.push('【문어 오른쪽】',
    '· 오른쪽얼굴 문어 (턱 오른쪽으로 당기기)',
    '· 왼쪽 얼굴 늘리기 (이마리프팅&사선내리기)');
  if(draw<0) out.push('【드로잉】','· 왼쪽 턱 위로 들어올려 우측으로 드로잉');
  else if(draw>0) out.push('【드로잉】','· 오른쪽 턱 위로 들어올려 좌측으로 드로잉');
  if(roll>0) out.push('【기울이기】','· 왼쪽 c0바운스');
  else if(roll<0) out.push('【기울이기】','· 오른쪽 c0바운스');
  if(ham>0) out.push('【햄버거】','· 우측으로 머리 돌린 후 오른광대와 후두면 압박');
  else if(ham<0) out.push('【햄버거】','· 좌측으로 머리 돌린 후 왼광대와 후두면 압박');
  if(nostR>0) out.push('【콧볼 오른쪽】','· 오른광대 후방경사화');
  else if(nostR<0) out.push('【콧볼 오른쪽】','· 오른광대 전방경사화');
  if(nostL>0) out.push('【콧볼 왼쪽】','· 왼광대 후방경사화');
  else if(nostL<0) out.push('【콧볼 왼쪽】','· 왼광대 전방경사화');
  $('method').textContent = out.length
    ? '🩹 개선법 (촉진 전 참고)\n'+out.join('\n')
    : '조정된 슬라이더가 없습니다. 먼저 중립으로 맞춘 뒤 눌러 주세요.';
};

$('dots').onclick=()=>{
  showDots=!showDots;
  $('dots').textContent='랜드마크 '+(showDots?'켬':'끔');
  if(P) draw($('cvA'),srcCanvas,P);
  render(parseFloat($('amp').value));                 // 현재 각도 유지하며 다시 그림
};

/* ===== selfcapture 핸드오프: 넘겨받은 사진으로 자동 시뮬 ===== */
async function _scLoad(dataUrl){ try{ origImg=await loadImage(dataUrl); await setSource(0,0,origImg.width,origImg.height); await fitIn(); }catch(e){} }
window.addEventListener('message',function(e){ if(e&&e.data&&e.data.scPhoto){ _scLoad(e.data.scPhoto); } });
(function(){ try{ var _d=localStorage.getItem('sc_simphoto'); if(_d){ _scLoad(_d); } }catch(e){} })();

</script>
