<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>소니드 얼굴윤곽 · 박람회</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a20; --ink:#f2efe9; --muted:#9aa0a8; --gold:#c9a86a; --rose:#c06a72; --line:#2a2f38; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:radial-gradient(120% 80% at 50% -10%,#1c2230 0%,var(--bg) 60%);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
  .brand{text-align:center;margin:14px 0 6px}
  .brand .lg{font-family:Georgia,serif;font-size:1.5rem;font-weight:700;letter-spacing:.04em}
  .brand .lg b{color:var(--gold)}
  .brand .tg{font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  h2{font-size:1.15rem;margin:0 0 4px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .menu{display:flex;flex-direction:column;gap:14px;margin-top:26px}
  .mbtn{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;text-align:left;color:var(--ink)}
  .mbtn:active{transform:scale(.99)}
  .mbtn .emo{font-size:1.9rem;flex:none}
  .mbtn .t{font-size:1.05rem;font-weight:800}
  .mbtn .d{font-size:.78rem;color:var(--muted);margin-top:3px}
  .mbtn .arr{margin-left:auto;color:var(--gold);font-size:1.3rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .fld{margin-bottom:15px}
  label{display:block;font-size:.82rem;font-weight:700;margin-bottom:7px}
  input[type=text],input[type=tel],textarea,select{width:100%;background:#0f1319;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:.95rem;font-family:inherit;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--gold)}
  textarea{min-height:54px;resize:vertical}
  .hist{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:10px}
  .hist .row1{display:flex;align-items:center;gap:10px}
  .hist .row1 .nm{font-weight:700;font-size:.9rem}
  .chk{position:relative;width:24px;height:24px;flex:none}
  .chk input{position:absolute;opacity:0;width:100%;height:100%;margin:0}
  .chk .box{width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.9rem;color:#0f1115;background:#0f1319}
  .chk input:checked + .box{background:var(--gold);border-color:var(--gold);color:#0f1115}
  .hist .extra{margin-top:9px;display:none;gap:8px;flex-wrap:wrap}
  .hist.on .extra{display:flex}
  .hist .extra input{flex:1;min-width:120px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#0f1319;border-radius:20px;padding:9px 14px;font-size:.85rem;cursor:pointer;font-weight:600}
  .chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
  .seg{display:flex;gap:8px}
  .seg .s{flex:1;text-align:center;border:1px solid var(--line);background:#0f1319;border-radius:9px;padding:10px;font-size:.85rem;font-weight:700;cursor:pointer}
  .seg .s.on{background:var(--gold);border-color:var(--gold);color:#0f1115}
  .go{width:100%;background:var(--gold);color:#0f1115;border:none;border-radius:12px;padding:15px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:6px}
  .back{background:none;border:none;color:var(--muted);font-size:.9rem;cursor:pointer;padding:8px 0;margin-bottom:6px}
  .hidden{display:none}
  /* 거울 */
  .mirrorwrap{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
  #cv{width:100%;height:100%;object-fit:cover;display:block}
  #vid{display:none}
  .mlabel{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:.8rem;font-weight:800;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7);letter-spacing:.05em}
  .mctrl{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  .mctrl button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:13px;font-size:.9rem;font-weight:700;cursor:pointer}
  .mctrl button.on{background:var(--gold);border-color:var(--gold);color:#0f1115}
  .camnote{color:var(--muted);font-size:.78rem;text-align:center;margin-top:12px;line-height:1.5}
  .thanks{text-align:center;padding:40px 10px}
  .thanks .big{font-size:3rem}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#26313f;color:#fff;padding:12px 20px;border-radius:8px;font-weight:700;font-size:.9rem;opacity:0;transition:.25s;z-index:99;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="lg">SO<b>NE</b>ED</div><div class="tg">얼굴윤곽 · 박람회</div></div>

  <!-- 홈 -->
  <section id="home">
    <h2>어서오세요 :)</h2>
    <div class="sub">아래에서 원하는 걸 눌러보세요</div>
    <div class="menu">
      <button class="mbtn" onclick="go('mirror')"><span class="emo">🪞</span><span><span class="t">마법의 거울</span><span class="d">내 얼굴 대칭 미리보기 · 라이브</span></span><span class="arr">›</span></button>
      <button class="mbtn" onclick="go('survey')"><span class="emo">📝</span><span><span class="t">상담 설문 작성</span><span class="d">상담 전에 미리 작성해주세요</span></span><span class="arr">›</span></button>
    </div>
  </section>

  <!-- 마법의 거울 -->
  <section id="mirror" class="hidden">
    <button class="back" onclick="go('home')">← 처음으로</button>
    <h2>🪞 마법의 거울</h2>
    <div class="sub">버튼을 눌러 대칭 얼굴을 확인해보세요</div>
    <div class="mirrorwrap">
      <video id="vid" playsinline autoplay muted></video>
      <canvas id="cv"></canvas>
      <div class="mlabel" id="mlabel">원본</div>
    </div>
    <div class="mctrl">
      <button data-m="orig" class="on" onclick="setMode('orig')">원본 거울</button>
      <button data-m="flip" onclick="setMode('flip')">좌우 반전</button>
      <button data-m="left" onclick="setMode('left')">◐ 왼쪽 대칭</button>
      <button data-m="right" onclick="setMode('right')">오른쪽 대칭 ◑</button>
    </div>
    <button data-m="cheek" class="cheekbtn" onclick="setMode('cheek')" style="width:100%;margin-top:9px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:13px;font-size:.9rem;font-weight:800;cursor:pointer">✨ 광대 각도 시뮬레이션</button>
    <div class="cheekpanel" id="cheekpanel" style="display:none;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px">
      <div id="cheekstatus" style="font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:12px">얼굴을 인식하는 중…</div>
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;margin-bottom:6px"><span>광대 내림 ↓</span><span>올림 ↑</span></div>
        <input type="range" id="sl_raise" min="-100" max="100" value="0" style="width:100%">
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;margin-bottom:6px"><span>후방경사 ↙</span><span>전방경사 ↗</span></div>
        <input type="range" id="sl_tilt" min="-100" max="100" value="0" style="width:100%">
      </div>
      <button onclick="resetCheek()" style="width:100%;margin-top:12px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px;font-size:.82rem;cursor:pointer">원래대로</button>
    </div>
    <div class="camnote" id="camnote">카메라를 켜려면 "허용"을 눌러주세요.<br>밝은 곳에서 정면을 봐주세요 :)</div>
  </section>

  <!-- 설문 -->
  <section id="survey" class="hidden">
    <button class="back" onclick="go('home')">← 처음으로</button>
    <h2>📝 상담 설문</h2>
    <div class="sub">정확한 상담을 위해 솔직하게 작성해주세요 (비공개)</div>

    <div class="card">
      <div class="fld"><label>성함</label><input type="text" id="s_name" placeholder="성함"></div>
      <div class="fld"><label>연락처</label><input type="tel" id="s_phone" inputmode="numeric" placeholder="010-0000-0000"></div>
    </div>

    <div class="card">
      <label style="margin-bottom:10px">성형 · 시술 히스토리 <span style="color:var(--muted);font-weight:500;font-size:.78em">(해당 항목 체크 + 위치/시기)</span></label>
      <div id="histbox"></div>
    </div>

    <div class="card">
      <label style="margin-bottom:10px">치아</label>
      <div class="fld"><label style="font-weight:600;font-size:.8rem">교정 여부</label>
        <div class="seg" data-seg="ortho"><div class="s on" data-v="안함">안 함</div><div class="s" data-v="진행중">진행중</div><div class="s" data-v="완료">완료</div></div>
      </div>
      <div class="fld"><label style="font-weight:600;font-size:.8rem">발치 여부</label>
        <div class="seg" data-seg="extract"><div class="s on" data-v="무">발치 안 함</div><div class="s" data-v="유">발치 함</div></div>
      </div>
      <div class="fld"><label style="font-weight:600;font-size:.8rem">라미네이트 / 미니쉬</label>
        <div class="seg" data-seg="veneer"><div class="s on" data-v="무">없음</div><div class="s" data-v="라미네이트">라미네이트</div><div class="s" data-v="미니쉬">미니쉬</div></div>
        <input type="text" id="s_veneer_when" placeholder="완료 시기 (예: 2024년 봄)" style="margin-top:8px">
      </div>
    </div>

    <div class="card">
      <label style="margin-bottom:10px">고민 부위 <span style="color:var(--muted);font-weight:500;font-size:.78em">(여러 개 선택 가능)</span></label>
      <div class="chips" id="worrychips"></div>
    </div>

    <div class="card">
      <div class="fld"><label>렌즈삽입술 (ICL 등) 여부</label>
        <div class="seg" data-seg="lens"><div class="s on" data-v="무">안 함</div><div class="s" data-v="유">함</div></div>
        <input type="text" id="s_lens_when" placeholder="시술 시기" style="margin-top:8px">
      </div>
      <div class="fld"><label>추가로 하고 싶은 말 (선택)</label><textarea id="s_memo" placeholder="자유롭게 적어주세요"></textarea></div>
    </div>

    <button class="go" onclick="submitSurvey()">제출하기</button>
  </section>

  <!-- 완료 -->
  <section id="done" class="hidden">
    <div class="thanks">
      <div class="big">💛</div>
      <h2>제출 완료!</h2>
      <div class="sub">작성해주셔서 감사해요.<br>잠시 후 상담에서 뵐게요 :)</div>
      <button class="go" style="max-width:220px;margin:20px auto 0" onclick="go('home')">처음으로</button>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
// ---- Supabase (소니드 프로젝트) ----
const SB_URL="https://xzclowgorxhcbsfrrbop.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6Y2xvd2dvcnhoY2JzZnJyYm9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MTg4MzIsImV4cCI6MjA5OTE5NDgzMn0.4BuAYPxlHOd3HwbKAkhcccNJAVjz6u9brnE4j9BWE6s";
const SB_H={ apikey:SB_KEY, Authorization:"Bearer "+SB_KEY, "Content-Type":"application/json" };
const $=id=>document.getElementById(id);
function toast(m){ const t=$("toast"); t.textContent=m; t.style.opacity="1"; clearTimeout(t._t); t._t=setTimeout(()=>t.style.opacity="0",2200); }

// ---- 화면 전환 ----
let camStarted=false;
function go(id){
  ["home","mirror","survey","done"].forEach(s=>$(s).classList.add("hidden"));
  $(id).classList.remove("hidden");
  window.scrollTo(0,0);
  if(id==="mirror") startCam();
  else stopCam();
}

// ---- 히스토리 항목 ----
const HISTS=[
  {k:"쌍커풀", loc:false}, {k:"코성형", loc:false}, {k:"필러", loc:true, ph:"위치 (예: 이마·팔자)"},
  {k:"보톡스", loc:true, ph:"위치 (예: 사각턱·이마)"}, {k:"양악수술", loc:false}, {k:"윤곽수술", loc:false, ph:""},
  {k:"기타 성형/시술", loc:true, ph:"내용"}
];
(function(){ let h=""; HISTS.forEach((x,i)=>{
  h+='<div class="hist" data-h="'+x.k+'"><div class="row1"><label class="chk"><input type="checkbox" onchange="this.closest(\'.hist\').classList.toggle(\'on\',this.checked)"><span class="box">✓</span></label><span class="nm">'+x.k+'</span></div><div class="extra">'+(x.loc?'<input type="text" class="loc" placeholder="'+(x.ph||"위치")+'">':'')+'<input type="text" class="when" placeholder="시기 (예: 2023년)"></div></div>';
}); $("histbox").innerHTML=h; })();

// ---- 고민부위 ----
const WORRIES=["얼굴 비대칭","볼 패임","주걱턱","무턱","광대 볼륨","이마 볼륨","사각턱","앞트임/뒤트임","기타"];
$("worrychips").innerHTML=WORRIES.map(w=>'<div class="chip" onclick="this.classList.toggle(\'on\')">'+w+'</div>').join("");

// ---- 세그먼트 ----
document.querySelectorAll(".seg").forEach(seg=>{ seg.querySelectorAll(".s").forEach(s=>{ s.onclick=()=>{ seg.querySelectorAll(".s").forEach(x=>x.classList.remove("on")); s.classList.add("on"); }; }); });
function segVal(name){ const seg=document.querySelector('[data-seg="'+name+'"]'); const on=seg.querySelector(".s.on"); return on?on.dataset.v:""; }

// ---- 설문 제출 ----
function uid(){ return "expo"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
async function submitSurvey(){
  const name=$("s_name").value.trim();
  if(!name){ toast("성함을 입력해주세요"); return; }
  const hist=[];
  document.querySelectorAll(".hist.on").forEach(h=>{ hist.push({항목:h.dataset.h, 위치:(h.querySelector(".loc")?h.querySelector(".loc").value.trim():""), 시기:(h.querySelector(".when")?h.querySelector(".when").value.trim():"")}); });
  const worries=[]; document.querySelectorAll("#worrychips .chip.on").forEach(c=>worries.push(c.textContent));
  const rec={ id:uid(), name:name, phone:$("s_phone").value.trim(),
    history:hist, ortho:segVal("ortho"), extract:segVal("extract"),
    veneer:segVal("veneer"), veneer_when:$("s_veneer_when").value.trim(),
    worries:worries, lens:segVal("lens"), lens_when:$("s_lens_when").value.trim(),
    memo:$("s_memo").value.trim(), at:new Date().toISOString() };
  try{
    await fetch(SB_URL+"/rest/v1/gongu_reservations",{method:"POST",headers:Object.assign({Prefer:"return=minimal"},SB_H),
      body:JSON.stringify([{id:rec.id, branch:"__expo", rec:rec, updated_at:rec.at}])});
    go("done");
  }catch(e){ toast("전송 오류 — 다시 시도해주세요"); }
}

// ---- 마법의 거울 ----
let stream=null, raf=null, mode="orig";
const vid=$("vid"), cv=$("cv");
async function startCam(){
  if(camStarted) return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:720},height:{ideal:960}},audio:false});
    vid.srcObject=stream; await vid.play(); camStarted=true; $("camnote").textContent="버튼으로 대칭을 확인해보세요 :)";
    loop();
  }catch(e){ $("camnote").textContent="카메라를 사용할 수 없어요. 브라우저 권한을 확인해주세요."; }
}
function stopCam(){ if(raf) cancelAnimationFrame(raf); raf=null; if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } camStarted=false; }
function setMode(m){ mode=m;
  document.querySelectorAll(".mctrl button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  document.querySelector(".cheekbtn").classList.toggle("on",m==="cheek");
  document.querySelector(".cheekbtn").style.background=(m==="cheek")?"var(--gold)":"var(--panel)";
  document.querySelector(".cheekbtn").style.color=(m==="cheek")?"#0f1115":"var(--ink)";
  $("cheekpanel").style.display=(m==="cheek")?"block":"none";
  $("mlabel").textContent={orig:"원본 거울",flip:"좌우 반전",left:"◐ 왼쪽 얼굴 대칭",right:"오른쪽 얼굴 대칭 ◑",cheek:"✨ 광대 각도"}[m];
  if(m==="cheek") loadFaceMesh();
}
const oc=document.createElement("canvas"); const octx=oc.getContext("2d");
const tmp=document.createElement("canvas"); const tctx=tmp.getContext("2d");
function loop(){
  raf=requestAnimationFrame(loop);
  if(!vid.videoWidth) return;
  const vw=vid.videoWidth, vh=vid.videoHeight;
  if(cv.width!==vw){ cv.width=vw; cv.height=vh; oc.width=vw; oc.height=vh; }
  const ctx=cv.getContext("2d");
  // base = 셀카 거울(좌우반전)로 offscreen에 그림
  octx.save(); octx.translate(vw,0); octx.scale(-1,1); octx.drawImage(vid,0,0,vw,vh); octx.restore();
  ctx.clearRect(0,0,vw,vh);
  if(mode==="orig"){ ctx.drawImage(oc,0,0); }
  else if(mode==="flip"){ ctx.save(); ctx.translate(vw,0); ctx.scale(-1,1); ctx.drawImage(oc,0,0); ctx.restore(); }
  else if(mode==="left"){ ctx.drawImage(oc,0,0,vw/2,vh,0,0,vw/2,vh); ctx.save(); ctx.translate(vw,0); ctx.scale(-1,1); ctx.drawImage(oc,0,0,vw/2,vh,0,0,vw/2,vh); ctx.restore(); }
  else if(mode==="right"){ ctx.drawImage(oc,vw/2,0,vw/2,vh,vw/2,0,vw/2,vh); ctx.save(); ctx.translate(vw,0); ctx.scale(-1,1); ctx.drawImage(oc,vw/2,0,vw/2,vh,vw/2,0,vw/2,vh); ctx.restore(); }
  else if(mode==="cheek"){ drawCheek(ctx,vw,vh); }
}
window.addEventListener("pagehide",stopCam);

// ---- 광대 각도 (얼굴인식 + 국소 워핑) ----
let faceLM=null, faceReady=false, faceFail=false, lastCheek=null;
async function loadFaceMesh(){
  if(faceLM||faceFail) return;
  $("cheekstatus").textContent="얼굴 인식 준비 중… (잠시만요)";
  try{
    const vision=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
    const fileset=await vision.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    faceLM=await vision.FaceLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},runningMode:"VIDEO",numFaces:1});
    faceReady=true; $("cheekstatus").textContent="✅ 슬라이더로 광대 각도를 조절해보세요";
  }catch(e){ faceFail=true; $("cheekstatus").textContent="⚠ 얼굴 인식을 불러오지 못했어요(인터넷 확인). 대칭 거울은 정상 작동해요."; }
}
function maskCanvas(d){ const c=document.createElement("canvas"); c.width=c.height=d; const x=c.getContext("2d"); const g=x.createRadialGradient(d/2,d/2,d*0.12,d/2,d/2,d/2); g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(1,"rgba(0,0,0,0)"); x.fillStyle=g; x.fillRect(0,0,d,d); return c; }
let _mask=null,_md=0;
function warpPatch(ctx,oc,cx,cy,r,dx,dy){
  const d=Math.round(r*2); if(d<8) return;
  if(!_mask||_md!==d){ _mask=maskCanvas(d); _md=d; }
  tmp.width=d; tmp.height=d;
  tctx.clearRect(0,0,d,d);
  // (cx-dx,cy-dy) 위치의 원본이 패치 중앙(=cx,cy)에 오도록 → 광대가 (dx,dy)만큼 이동한 효과
  tctx.drawImage(oc, r-(cx-dx), r-(cy-dy));
  tctx.globalCompositeOperation="destination-in";
  tctx.drawImage(_mask,0,0);
  tctx.globalCompositeOperation="source-over";
  ctx.drawImage(tmp, cx-r, cy-r);
}
function avgPt(lms,idxs,vw,vh){ let sx=0,sy=0; idxs.forEach(i=>{ sx+=(1-lms[i].x); sy+=lms[i].y; }); return {x:sx/idxs.length*vw, y:sy/idxs.length*vh}; }
function drawCheek(ctx,vw,vh){
  ctx.drawImage(oc,0,0);
  if(!faceReady||!faceLM){ return; }
  let res=null; try{ res=faceLM.detectForVideo(vid, performance.now()); }catch(e){}
  if(res&&res.faceLandmarks&&res.faceLandmarks[0]){
    const lm=res.faceLandmarks[0];
    // 광대(zygomatic) 근처 포인트 평균 (좌/우) — 화면 좌우반전 반영
    const L=avgPt(lm,[50,205,101,118],vw,vh);
    const R=avgPt(lm,[280,425,330,347],vw,vh);
    // 얼굴 폭으로 반경 산정
    const fw=Math.abs((1-lm[454].x)-(1-lm[234].x))*vw; const r=Math.max(30,fw*0.30);
    lastCheek={L,R,r};
  }
  if(lastCheek){
    const raise=(+$("sl_raise").value||0)/100, tilt=(+$("sl_tilt").value||0)/100;
    const dy=-raise*lastCheek.r*0.55;      // 올림(+)이면 위로
    const dxL=-tilt*lastCheek.r*0.45, dxR=tilt*lastCheek.r*0.45; // 전방경사(+): 광대 바깥쪽으로
    if(Math.abs(raise)>0.02||Math.abs(tilt)>0.02){
      warpPatch(ctx,oc,lastCheek.L.x,lastCheek.L.y,lastCheek.r,dxL,dy);
      warpPatch(ctx,oc,lastCheek.R.x,lastCheek.R.y,lastCheek.r,dxR,dy);
    }
  }
}
function resetCheek(){ $("sl_raise").value=0; $("sl_tilt").value=0; }
</script>
